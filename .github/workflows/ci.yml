name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --cov=feature_engineering_tk --cov-report=xml --cov-report=term-missing

      - name: Upload coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: flake8
        run: flake8 feature_engineering_tk --max-line-length=120 --extend-ignore=E203,W503

      - name: black --check
        run: black --check feature_engineering_tk tests

      # mypy is informational only until the codebase is fully annotated;
      # flip to a hard failure once feature_engineering_tk type-checks cleanly.
      - name: mypy (non-blocking)
        run: mypy feature_engineering_tk --ignore-missing-imports || true

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  version-consistency:
    name: Version consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare declared versions across tracked files
        shell: bash
        run: |
          set -euo pipefail

          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          SETUPPY=$(grep -m1 "version='" setup.py | sed -E "s/.*version='([^']*)'.*/\1/")
          INIT=$(grep -m1 '__version__' feature_engineering_tk/__init__.py | sed -E "s/.*'([^']*)'.*/\1/")
          README=$(grep -m1 '^# Feature Engineering Toolkit v' README.md | sed -E 's/.*v([0-9][^ ]*)/\1/')
          CHANGELOG=$(grep -m1 '^## \[' CHANGELOG.md | sed -E 's/^## \[([^]]*)\].*/\1/')

          echo "pyproject.toml : $PYPROJECT"
          echo "setup.py       : $SETUPPY"
          echo "__init__.py    : $INIT"
          echo "README.md      : $README"
          echo "CHANGELOG.md   : $CHANGELOG"

          if [ "$PYPROJECT" != "$SETUPPY" ] || [ "$PYPROJECT" != "$INIT" ] || [ "$PYPROJECT" != "$README" ] || [ "$PYPROJECT" != "$CHANGELOG" ]; then
            echo "::error::Version mismatch across pyproject.toml, setup.py, __init__.py, README.md, CHANGELOG.md"
            exit 1
          fi

          echo "All 5 version locations agree on $PYPROJECT"
